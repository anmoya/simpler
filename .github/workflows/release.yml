name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Install appimagetool
        run: |
          curl -sL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Patch AppImage with Wayland/EGL launch-fix hook
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          ./scripts/patch-appimage-wayland-fix.sh "$APPIMAGE"

      - name: Sign AppImage and write update manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -x
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          if [[ -z "$APPIMAGE" ]]; then
            echo "No .AppImage found under src-tauri/target/release/bundle/appimage" >&2
            ls -la src-tauri/target/release/bundle/appimage >&2 || true
            exit 1
          fi
          npm run tauri signer sign -- "$APPIMAGE"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const [, appImage, repo, refName] = process.argv;
            const manifest = {
              version: refName.replace(/^v/, ""),
              notes: "",
              pub_date: new Date().toISOString(),
              platforms: {
                "linux-x86_64": {
                  signature: fs.readFileSync(appImage + ".sig", "utf8").trim(),
                  url: `https://github.com/${repo}/releases/download/${refName}/${path.basename(appImage)}`,
                },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          ' "$APPIMAGE" "${{ github.repository }}" "${{ github.ref_name }}"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Simpler ${{ github.ref_name }}" \
            --notes "" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig \
            latest.json
