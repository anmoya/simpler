name: Test

# Proves both platforms compile and pass the tests that exist (JS/React unit
# tests and Rust native tests). It does NOT prove clipboard, drag-and-drop,
# traffic lights, or window lifecycle behave correctly — those stay manual
# checks on real hardware (see ADR 0014). Its job is narrower but load-
# bearing: catch a `cfg(target_os = "macos")` block that fails to compile on
# Linux (or vice versa) before a release tag is pushed, since no single
# compiler invocation ever sees both platforms' cfg branches together.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Run JS/React tests
        run: npm run test

      - name: Run Rust native tests
        run: npm run test:native
